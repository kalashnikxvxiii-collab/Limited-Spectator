plugins {
    // ModDevGradle 2.0.141 replaces NeoGradle 7.x for MC 26.1+.
    // See https://docs.neoforged.net/toolchain/docs/plugins/mdg/
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = 'LimitedSpectator-neoforge'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation project(':common')
}

neoForge {
    // Specify NeoForge build matching the MC version (see gradle.properties).
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run')
            programArguments.addAll '--username', 'DevClient'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('runServer')
            programArgument '--nogui'
        }
    }

    mods {
        // Group both source sets under the same mod identifier so ModDevGradle
        // bundles them into one fake-fat-jar as the limitedspectator mod.
        // The :common module shares the com.karashi.limitedspectator package
        // with this module (no two separate modules may share a package).
        // Without including :common here, runClient/runServer crash at boot
        // with NoClassDefFoundError: SpectatorConfig.
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

java {
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }

    // Bundle :common's compiled classes into the shipped JAR so end users only
    // need a single file.
    from(project(':common').sourceSets.main.output)
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.allSource)
}
