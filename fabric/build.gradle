plugins {
    // Plugin ID changed for MC 26.1: 'fabric-loom' -> 'net.fabricmc.fabric-loom'.
    // The new Loom no longer remaps Minecraft or mods because MC 26.1 ships with
    // official Mojang mappings. See https://fabricmc.net/2026/03/14/261.html
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'LimitedSpectator-fabric'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation project(':common')

    // Minecraft is no longer remapped. No 'mappings' line: 26.1 is unobfuscated.
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Plain 'implementation' (not 'modImplementation') since Loom 1.16 stopped
    // performing the remap dance for 26.1+.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        client {
            client()
            name = 'Fabric Client'
            source sourceSets.main
        }
        server {
            server()
            name = 'Fabric Server'
            source sourceSets.main
        }
    }

    // Same trick as NeoForge's modSources grouping: include :common's source
    // set as part of the limitedspectator mod so its classes are loaded by
    // Fabric's mod classloader at dev runtime (production JAR bundles them too,
    // see jar { from(...) } below).
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('LICENSE') {
        rename { "${it}_LimitedSpectator-fabric" }
    }

    // Bundle :common's compiled classes so users only need a single JAR.
    from(project(':common').sourceSets.main.output)
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.allSource)
}
