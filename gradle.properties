org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled while Loom 1.16-SNAPSHOT is still settling.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip

# Mod Properties
mod_id=limitedspectator
mod_name=Limited Spectator
mod_license=MIT
mod_version=3.0.0-alpha.1
mod_authors=Karashi
mod_description=A restricted spectator mode for Minecraft servers
mod_group_id=com.karashi

# Minecraft — first release on Mojang's new YY.release.patch versioning scheme
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]

# NeoForge — uses ModDevGradle 2.0.141+ (replaces NeoGradle 7.x)
# Full version string: <mc-version>.<build-number>
neo_version=26.1.2.71

# Fabric — Loom 1.16-SNAPSHOT no longer remaps (MC is now unobfuscated)
# Plugin ID changed: 'fabric-loom' -> 'net.fabricmc.fabric-loom'
fabric_loader_version=0.19.2
fabric_api_version=0.150.0+26.1.2
loom_version=1.16-SNAPSHOT
