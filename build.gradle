// Root build script — multi-project parent.
//
// The root project itself doesn't ship any artifact on the mc-26.1 line. Each
// loader (neoforge, fabric) and the loader-agnostic :common module declare
// their own plugins and dependencies.

allprojects {
    group = 'com.karashi'
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}

// NOTE: The CVE-pinning resolutionStrategy block (Netty 4.1.125.Final, Log4j
// 2.25.3, LZ4 1.10.1, Commons Lang 3.18.0) carried over from MC 1.21.1 has
// been REMOVED on the mc-26.1 line. Reasons:
//   - 'io.netty:netty-codec-compression' no longer exists as a separate
//     artifact at 4.1.125.Final; NeoForge 26.1.x pulls a different Netty
//     layout that doesn't have that module.
//   - MC 26.1.2 ships with Netty, Log4j, Commons Lang versions that already
//     include the relevant 2025-Q4 / 2026-Q1 CVE patches.
// Re-introduce per-CVE if a future dependency audit flags a transitive
// vulnerability that NeoForge / Fabric haven't already addressed upstream.
