// :common is loader-agnostic — no Minecraft / NeoForge / Fabric imports allowed.
// Java toolchain + JUnit/Mockito test deps are inherited from the root
// allprojects/subprojects blocks (group, version, languageVersion = 25,
// release = 25, CVE-pinning forces).

plugins {
    id 'java'
}

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // SLF4J for logging (provided by loaders at runtime).
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    // Bumped Junit/Mockito to versions known to work on Java 25.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.2'
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine:5.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.2'

    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'

    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'Limited Spectator Common',
                'Specification-Vendor'  : 'Karashi',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'Karashi'
        ])
    }
}
